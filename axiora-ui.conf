## HTTP -> HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name axiora-ui-components.forgebase.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

## HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name axiora-ui-components.forgebase.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/forgebase.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/forgebase.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 2G;

    access_log /var/log/nginx/axiora-ui_access.log;
    error_log  /var/log/nginx/axiora-ui_error.log;

    root /usr/share/nginx/html/axiora-ui;
    index index.html;

    location ~* \.(?:css|js|svg|woff2?|ttf|eot|ico|png|jpe?g|gif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Never cache index.html so a new deploy is picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}